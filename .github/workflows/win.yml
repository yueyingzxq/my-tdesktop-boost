name: Windows.
# Build and release Windows x64 Qt6 with self-healing python packager

on:
  workflow_dispatch:
  push:
    branches:
      - feature/speed-boost
      - dev
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '!docs/building-win*.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/win.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.sh'
      - 'Telegram/Telegram.plist'
  pull_request:
    branches:
      - feature/speed-boost
      - dev
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '!docs/building-win*.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/win.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.sh'
      - 'Telegram/Telegram.plist'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'release-build' }}
  cancel-in-progress: true

jobs:

  windows:
    name: Windows
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || ((github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/nightly') && 'depot-windows-latest-16' || 'windows-latest') }}
    permissions:
      contents: write

    strategy:
      matrix:
        arch: [x64]
        qt: [qt6]
        generator: [""]

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Configure Pagefile.
        uses: al-cheb/configure-pagefile-action@v1.4
        with:
          minimum-size: 32GB
          maximum-size: 32GB
          disk-root: "D:"

      - name: Verify Pagefile.
        shell: powershell
        run: |
          Get-CimInstance Win32_PageFileSetting | Select-Object Name, InitialSize, MaximumSize
          Get-CimInstance Win32_OperatingSystem | Select-Object TotalVirtualMemorySize, FreeVirtualMemory, TotalVisibleMemorySize, FreePhysicalMemory

      - name: Prepare directories.
        run: |
          mkdir %GITHUB_WORKSPACE%\TBuild\Libraries
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries${{ matrix.arch == 'x64' && '\win64' || '' }}>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - name: Install VS 2026 Build Tools.
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'vs_buildtools.exe'
          Invoke-WebRequest -Uri https://aka.ms/vs/18/stable/vs_buildtools.exe -OutFile $exe
          $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList `
            '--quiet','--wait','--norestart','--nocache', `
            '--add','Microsoft.VisualStudio.Workload.VCTools', `
            '--add','Microsoft.VisualStudio.Component.VC.Tools.ARM64', `
            '--add','Microsoft.VisualStudio.Component.VC.ATL.ARM64'
          Remove-Item $exe -Force -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { exit $p.ExitCode }

      - name: Visual Studio ATL component.
        shell: pwsh
        run: |
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $vswhere = Join-Path $installer 'vswhere.exe'
          $setup = Join-Path $installer 'setup.exe'
          if (-not (Test-Path $vswhere) -or -not (Test-Path $setup)) {
            throw "Visual Studio Installer is incomplete at $installer."
          }

          $toolsComponent = 'Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64'
          $atlComponent = 'Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL'
          $path = @(& $vswhere -latest -products '*' -requires $toolsComponent -property installationPath)[0]
          if (-not $path) {
            throw "No Visual Studio instance provides $toolsComponent."
          }

          $toolset = Get-ChildItem (Join-Path $path 'VC\Tools\MSVC') -Directory `
            | Where-Object { $_.Name -like '14.44.*' } `
            | Sort-Object Name -Descending `
            | Select-Object -First 1
          if (-not $toolset) {
            throw "The selected Visual Studio instance has no 14.44 toolset."
          }
          $header = Join-Path $toolset.FullName 'atlmfc\include\atlbase.h'
          if (Test-Path $header) {
            Write-Host "ATL is already installed for $($toolset.Name)."
            exit 0
          }

          $process = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            'modify',
            '--installPath', "`"$path`"",
            '--add', $atlComponent,
            '--quiet', '--norestart', '--nocache'
          )
          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Visual Studio Installer exited with $($process.ExitCode)."
          }
          if (-not (Test-Path $header)) {
            throw "$atlComponent completed without installing $header."
          }

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: ${{ matrix.arch }}
          sdk: ${{ env.SDK }}
          toolset: ${{ case(matrix.arch == 'arm64', '', '14.44') }}

      - name: Verify Visual Studio ATL component.
        shell: pwsh
        run: |
          $atlInclude = Join-Path $env:VCToolsInstallDir 'atlmfc\include'
          $header = Join-Path $atlInclude 'atlbase.h'
          if (-not (Test-Path $header)) {
            throw "The selected toolset has no ATL header at $header."
          }
          if (($env:INCLUDE -split ';') -notcontains $atlInclude) {
            throw "The selected toolset did not add $atlInclude to INCLUDE."
          }

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-libs-v2rel-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-libs-v2rel-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt' }}-rel-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ matrix.arch }}-${{ matrix.qt || 'qt' }}-rel-

      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent ${{ matrix.qt }}

      - name: Read configuration matrix.
        shell: bash
        run: |
          ARTIFACT_NAME="Telegram"

          ARCH=""
          if [ -n "${{ matrix.arch }}" ]; then
            case "${{ matrix.arch }}" in
              x64_x86) ARCH="x86";;
              arm64) ARCH="arm";;
              *) ARCH="${{ matrix.arch }}";;
            esac
            echo "Architecture from matrix: $ARCH"
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.arch }}"
          fi

          if [ -n "${{ matrix.qt }}" ]; then
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.qt }}"
          fi

          GENERATOR=""
          if [ -n "${{ matrix.generator }}" ]; then
            GENERATOR="-G \"${{ matrix.generator }}\""
            echo "Generator from matrix: $GENERATOR"
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.generator }}"
          fi
          echo "TDESKTOP_BUILD_GENERATOR=$GENERATOR" >> $GITHUB_ENV

          [ -n "$GENERATOR" ] && ARCH=""
          echo "TDESKTOP_BUILD_ARCH=$ARCH" >> $GITHUB_ENV

          DEFINE=""
          if [ -n "${{ matrix.defines }}" ]; then
            DEFINE="-D ${{ matrix.defines }}=ON"
            echo "Define from matrix: $DEFINE"
            ARTIFACT_NAME="${ARTIFACT_NAME} ${{ matrix.defines }}"
          fi
          echo "TDESKTOP_BUILD_DEFINE=$DEFINE" >> $GITHUB_ENV

          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV

          API="-D TDESKTOP_API_ID=611335 -D TDESKTOP_API_HASH=d524b414d21f4d37f08684c1df41ac9c"

          echo "TDESKTOP_BUILD_API=$API" >> $GITHUB_ENV

      - name: Free up some disk space.
        shell: bash
        run: |
          echo "Current disk space on D: drive (147GB available):"
          df -h

      - name: Telegram Desktop build.
        if: env.ONLY_CACHE == 'false'
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          %TDESKTOP_BUILD_GENERATOR% ^
          %TDESKTOP_BUILD_ARCH% ^
          ${{ matrix.qt }} ^
          %TDESKTOP_BUILD_API% ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF ^
          %TDESKTOP_BUILD_DEFINE%

          cmake --build ..\out --config Release --parallel

      - name: Move artifact.
        if: (env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly')
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Release
          mkdir artifact
          move %OUT%\Telegram.exe artifact/
          move %OUT%\Updater.exe artifact/
      - name: Package zip.
        if: (env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly')
        shell: python
        run: |
          # -*- coding: utf-8 -*-
          import os, sys, shutil, zipfile

          try:
              if hasattr(sys.stdout, 'reconfigure'):
                  sys.stdout.reconfigure(encoding='utf-8', errors='replace')
              if hasattr(sys.stderr, 'reconfigure'):
                  sys.stderr.reconfigure(encoding='utf-8', errors='replace')
          except Exception:
              pass

          def log(msg):
              try:
                  print(str(msg))
              except Exception:
                  try:
                      print(str(msg).encode('ascii', errors='backslashreplace').decode('ascii'))
                  except Exception:
                      pass

          workspace = os.environ.get('GITHUB_WORKSPACE', os.getcwd())
          tbuild = os.environ.get('TBUILD', os.path.join(workspace, 'TBuild')).strip()
          repo_name = os.environ.get('REPO_NAME', 'my-tdesktop-boost').strip()

          artifact_dir = os.path.join(workspace, 'artifact')
          os.makedirs(artifact_dir, exist_ok=True)

          # 1. Ensure binaries are in artifact/
          out_dirs = [
              os.path.join(tbuild, repo_name, 'out', 'Release'),
              os.path.join(workspace, 'out', 'Release'),
              artifact_dir,
          ]
          for b in ['Telegram.exe', 'Updater.exe']:
              dst = os.path.join(artifact_dir, b)
              if not os.path.isfile(dst):
                  for d in out_dirs:
                      src = os.path.join(d, b)
                      if os.path.isfile(src):
                          shutil.copy2(src, dst)
                          log(f"Copied {b} from {src}")
                          break
              if os.path.isfile(dst):
                  log(f"Verified binary: {dst} ({os.path.getsize(dst):,} bytes)")
              else:
                  log(f"WARNING: {b} not found in output directories!")

          # 2. Copy user guide assets from repo root
          src_dirs = [
              os.path.join(tbuild, repo_name),
              os.path.join(workspace, repo_name),
              workspace,
          ]
          doc_names = ['新手使用指南.txt', '一键更新.bat', 'update.bat', 'update.ps1', 'README.md']
          for src_dir in src_dirs:
              if os.path.isdir(src_dir):
                  for f in doc_names:
                      src = os.path.join(src_dir, f)
                      dst = os.path.join(artifact_dir, f)
                      if os.path.isfile(src) and not os.path.isfile(dst):
                          shutil.copy2(src, dst)
                          log(f"Copied asset: {f}")
                  guide = os.path.join(src_dir, '新手使用指南.txt')
                  guide_dst = os.path.join(artifact_dir, 'QuickStart_Guide.txt')
                  if os.path.isfile(guide) and not os.path.isfile(guide_dst):
                      shutil.copy2(guide, guide_dst)
                      log("Copied QuickStart_Guide.txt")

          # 3. Create Telegram_x64_qt6.zip
          zip_path = os.path.join(artifact_dir, 'Telegram_x64_qt6.zip')
          files_to_zip = [f for f in os.listdir(artifact_dir) if not f.lower().endswith('.zip') and os.path.isfile(os.path.join(artifact_dir, f))]
          log(f"Packaging {len(files_to_zip)} files into zip")

          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
              for f in files_to_zip:
                  p = os.path.join(artifact_dir, f)
                  log(f"  Writing {f} ({os.path.getsize(p):,} bytes)...")
                  zf.write(p, arcname=f)

          log(f"SUCCESS: Zip created! Size: {os.path.getsize(zip_path):,} bytes")

      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        if: (env.UPLOAD_ARTIFACT == 'true') || (github.ref == 'refs/heads/nightly')
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact\
          retention-days: 7

      - name: Publish to GitHub Release.
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/feature/speed-boost' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: latest-boost
          name: Telegram Desktop Boost (Latest)
          body: |
            ## 🚀 Telegram Desktop Boost 极速增强版
            * **构建分支**: `${{ github.ref_name }}`
            * **提交哈希**: `${{ github.sha }}`

            ### 🌟 核心功能特性与开关位置

            #### 1. ⚡ Network Boost（16 通道并发与极限下载加速）
            * **文件下载（另存为）**：开启 1MB 超大分片 + 16 通道并发，默认拉满物理带宽；
            * **视频在线播放**：128KB 规范切片 + 8MB 激进预读缓冲 + 32 切片并发流水线，**Playback Threads 滑块支持 2~16 线程自由调节**，兼顾 4K 秒播与节点稳定性；
            * **长连接保活**：120 秒 Keep-Alive 热连接，免去频繁重新握手延迟。
            * **开关位置**：`设置 (Settings) -> 高级 (Advanced) -> 数据与存储 (Data and storage) -> Network Boost / Playback Threads`（默认开启，16 线程）。

            #### 2. 🎬 自动连续播放与沉浸全屏
            * 视频播放完毕后自动无缝衔接下一个媒体，切换后 1 秒自动平滑淡出隐藏进度条；
            * 支持快捷键 `F` 一键全屏（图片与视频均支持）；
            * 手动 `Ctrl + 右键` 切换时，图片保持全屏展示，切换回视频后进度条自动隐藏。
            * **开关位置**：内置播放器控制条右侧的 **YouTube 风格滑动开关**（可随时开启/关闭）。

            #### 3. ↗️ 原位转发（播放不中断）
            * 无论全屏或窗口模式下观看视频，右键点击“转发”时，底层视频持续流畅播放；
            * 转发面板在视频上方浮层弹出，选择目标发送后自动关闭，观影与分享两不耽误。

            #### 4. 🔄 软件内一键原生自动更新
            * 自动检测专属 GitHub Release 最新版本；
            * 有新版本发布时，聊天列表顶部自动弹出绿色 **`Update Telegram`** 提示，点击即可毫秒级热替换重启完成升级；
            * Windows 用户亦可随时在安装目录下双击运行 **`一键更新.bat`** 快速同步最新版本。

            ### 📥 快速安装与数据迁移
            * **Windows 用户**：下载下方 `Telegram_x64_qt6.zip` 解压至任意非系统盘文件夹（如 `D:\Software\Telegram\`）直接运行。
            * **老用户无缝迁移（免重新登录）**：将旧版 Telegram 目录下的 **`tdata`** 文件夹直接复制到本软件目录下，双击即可免密登录，聊天记录与配置 100% 完整保留。
            * **一键汉化语言包**：登录后在聊天框打开 `https://t.me/setlanguage/zhcncc` 即可切换中文。
            * **macOS 用户**：下载 `Telegram_macOS.zip` 解压将 `Telegram.app` 拖入“应用程序”。如遇门禁拦截，右键选择“打开”，或在终端执行 `xattr -cr /Applications/Telegram.app` 即可。
          files: |
            artifact/Telegram_x64_qt6.zip
            artifact/Telegram.exe
            artifact/Updater.exe
            artifact/QuickStart_Guide.txt
            artifact/*.bat
            artifact/*.ps1
