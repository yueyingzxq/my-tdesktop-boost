name: MacOS.

on:
  workflow_dispatch:
  push:
    branches:
      - feature/speed-boost
      - dev
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '!docs/building-mac*.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/mac.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/Resources/winrc/**'
      - 'Telegram/SourceFiles/platform/win/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/configure.bat'
      - 'package_windows.py'
  pull_request:
    branches:
      - feature/speed-boost
      - dev
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '!docs/building-mac*.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/mac.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/Resources/winrc/**'
      - 'Telegram/SourceFiles/platform/win/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/configure.bat'
      - 'package_windows.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'release-build' }}
  cancel-in-progress: true

jobs:

  macos:
    name: MacOS
    runs-on: macos-latest
    permissions:
      contents: write

    strategy:
      matrix:
        defines:
          - ""

    env:
      GIT: "https://github.com"
      CMAKE_GENERATOR: "Ninja"
      CMAKE_BUILD_TYPE: "Debug"
      CMAKE_BUILD_PARALLEL_LEVEL: ""
      CMAKE_PREFIX_PATH: "/opt/homebrew/opt/ffmpeg@6:/opt/homebrew/opt/openal-soft"
      TDE2E: "51743dfd01dff6179e2d8f7095729caa4e2222e9"
      TLOTTIE: "92df98dc209bc39b1e567ec74a8c86a0af5239de"
      WALLET_ENGINE: "e59e0d89d7ee90c388bf36e3334c5b276f396697"
      RUST_PATCHES: "aec474953ff7ee9b6e4cd9b8658288ea86d124f3"
      RUST_TOOLCHAIN: "1.96.1"
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      MANUAL_CACHING: "1"
      AUTO_CACHING: "1"

    steps:
      - name: Get repository name.
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.REPO_NAME }}

      - name: First set up.
        run: |
          libs="ada-url ffmpeg@6 jpeg-xl libavif libheif minizip openal-soft openh264 openssl opus qtbase qtimageformats qtshadertools qtsvg xz"
          brew update
          brew upgrade || true
          brew install autoconf automake boost cmake libtool ninja pkg-config python $libs
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          sudo sed -i '' '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/ -g//' /opt/homebrew/share/cmake/Modules/Compiler/GNU.cmake || true

          xcodebuild -version > CACHE_KEY.txt
          brew list --versions $libs >> CACHE_KEY.txt
          echo $MANUAL_CACHING >> CACHE_KEY.txt
          echo "$GITHUB_WORKSPACE" >> CACHE_KEY.txt
          if [ "$AUTO_CACHING" = "1" ]; then
            thisFile=$REPO_NAME/.github/workflows/mac.yml
            echo `md5 -q $thisFile` >> CACHE_KEY.txt
          fi
          echo "CACHE_KEY=`md5 -q CACHE_KEY.txt`" >> $GITHUB_ENV

          TARGET=$(grep 'set(QT_SUPPORTED_MIN_MACOS_VERSION' /opt/homebrew/Cellar/qtbase/*/lib/cmake/Qt6/Qt6ConfigExtras.cmake 2>/dev/null | head -n 1 | sed -E 's/^.*"(.*)"\)$/\1/' || true)
          if [ -z "$TARGET" ]; then TARGET="12.0"; fi
          echo "MACOSX_DEPLOYMENT_TARGET=$TARGET" >> $GITHUB_ENV
          echo "LibrariesPath=`pwd`" >> $GITHUB_ENV

          echo "RNNOISE=`curl -sSL --header 'Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' https://api.github.com/repos/xiph/rnnoise/git/refs/heads/master | jq -r .object.sha`" >> $GITHUB_ENV
          echo "WEBRTC=`curl -sSL --header 'Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' https://api.github.com/repos/desktop-app/tg_owt/git/refs/heads/master | jq -r .object.sha`" >> $GITHUB_ENV

      - name: Rust libraries cache.
        id: cache-tdesktop-rust
        uses: actions/cache@v4
        with:
          path: ${{ env.LibrariesPath }}/local/tdesktop_rust
          key: ${{ runner.OS }}-tdesktop-rust-${{ env.TLOTTIE }}-${{ env.WALLET_ENGINE }}-${{ env.RUST_PATCHES }}-${{ env.RUST_TOOLCHAIN }}-${{ env.CACHE_KEY }}
      - name: Rust libraries.
        if: steps.cache-tdesktop-rust.outputs.cache-hit != 'true'
        run: |
          cd "$LibrariesPath"
          export RUSTUP_HOME="$LibrariesPath/rustup"
          export CARGO_HOME="$LibrariesPath/cargo"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o rustup-init.sh
          sh rustup-init.sh -y --no-modify-path --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
          export RUSTUP_TOOLCHAIN="$RUST_TOOLCHAIN"
          export PATH="$CARGO_HOME/bin:$PATH"

          git init rust-patches
          cd rust-patches
          git remote add origin "$GIT/desktop-app/patches.git"
          git fetch --depth=1 origin "$RUST_PATCHES"
          git reset --hard FETCH_HEAD
          cd "$LibrariesPath"

          git init tlottie
          cd tlottie
          git remote add origin "$GIT/dkaraush/tlottie.git"
          git fetch --depth=1 origin "$TLOTTIE"
          git reset --hard FETCH_HEAD
          cd "$LibrariesPath"

          export GIT_LFS_SKIP_SMUDGE=1
          git init wallet-engine
          cd wallet-engine
          git remote add origin "$GIT/i582/wallet-engine.git"
          git fetch --depth=1 origin "$WALLET_ENGINE"
          git reset --hard FETCH_HEAD
          git apply ../rust-patches/wallet-engine.patch
          cd "$LibrariesPath"

          cargo new --lib --vcs none tdesktop_rust
          cd tdesktop_rust
          printf 'pub use ::tlottie;\npub use ::wallet_engine;\n' > src/lib.rs
          cargo add --path ../tlottie --features c-api
          cargo add --path ../wallet-engine
          cargo rustc --lib --release \
            --crate-type staticlib --crate-type cdylib \
            --config "profile.release.opt-level='z'" \
            --config "profile.release.lto='thin'" \
            --config "profile.release.codegen-units=1" \
            --config "profile.release.panic='unwind'" \
            --config "profile.release.package.tlottie.opt-level=3" \
            -- --print native-static-libs
          install -d "$LibrariesPath/local/tdesktop_rust/lib" "$LibrariesPath/local/tdesktop_rust/include/tlottie" "$LibrariesPath/local/tdesktop_rust/include/wallet_engine"
          install -m 644 target/release/libtdesktop_rust.a "$LibrariesPath/local/tdesktop_rust/lib/libtdesktop_rust.a"
          install -m 644 ../tlottie/include/tlottie.h "$LibrariesPath/local/tdesktop_rust/include/tlottie/tlottie.h"
          cargo run --manifest-path ../wallet-engine/bindgen/cpp/bindgen/Cargo.toml --locked -- \
            --library --out-dir "$LibrariesPath/local/tdesktop_rust/include/wallet_engine" \
            target/release/libtdesktop_rust.dylib

      - name: RNNoise cache.
        id: cache-rnnoise
        uses: actions/cache@v4
        with:
          path: ${{ env.LibrariesPath }}/local/rnnoise
          key: ${{ runner.OS }}-rnnoise-${{ env.RNNOISE }}-${{ env.CACHE_KEY }}
      - name: RNNoise.
        if: steps.cache-rnnoise.outputs.cache-hit != 'true'
        run: |
          cd $LibrariesPath

          git clone --depth=1 $GIT/xiph/rnnoise.git
          cd rnnoise
          ./autogen.sh
          ./configure --prefix=$LibrariesPath/local/rnnoise --disable-examples --disable-doc
          make -j$(sysctl -n hw.logicalcpu)
          make install

      - name: WebRTC cache.
        id: cache-webrtc
        uses: actions/cache@v4
        with:
          path: ${{ env.LibrariesPath }}/local/tg_owt
          key: ${{ runner.OS }}-webrtc-${{ env.WEBRTC }}-${{ env.CACHE_KEY }}
      - name: WebRTC.
        if: steps.cache-webrtc.outputs.cache-hit != 'true'
        run: |
          cd $LibrariesPath

          git clone --depth=1 --recursive --shallow-submodules $GIT/desktop-app/tg_owt.git
          cd tg_owt

          cmake -Bbuild . -DCMAKE_INSTALL_PREFIX=$LibrariesPath/local/tg_owt
          cmake --build build
          cmake --install build

      - name: TDE2E cache.
        id: cache-tde2e
        uses: actions/cache@v4
        with:
          path: ${{ env.LibrariesPath }}/local/tde2e
          key: ${{ runner.OS }}-tde2e-${{ env.TDE2E }}-${{ env.CACHE_KEY }}
      - name: TDE2E.
        if: steps.cache-tde2e.outputs.cache-hit != 'true'
        run: |
          cd $LibrariesPath

          git init tde2e
          cd tde2e
          git remote add origin $GIT/tdlib/td.git
          git fetch --depth=1 origin $TDE2E
          git reset --hard FETCH_HEAD

          cmake -Bbuild . -DCMAKE_INSTALL_PREFIX=$LibrariesPath/local/tde2e -DTD_E2E_ONLY=ON
          cmake --build build
          cmake --install build

      - name: Telegram Desktop build.
        if: env.ONLY_CACHE == 'false'
        run: |
          cd $REPO_NAME
          export CMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH$(find $LibrariesPath/local -mindepth 1 -maxdepth 1 -type d -exec printf ':%s' {} +)"

          DEFINE=""
          if [ -n "${{ matrix.defines }}" ]; then
            DEFINE="-D ${{ matrix.defines }}=ON"
            echo "Define from matrix: $DEFINE"
          fi

          cmake -Bbuild . -DTDESKTOP_API_ID=611335 -DTDESKTOP_API_HASH=d524b414d21f4d37f08684c1df41ac9c $DEFINE || {
            echo "=== CMake configuration failed! Showing error logs ==="
            cat build/CMakeFiles/CMakeOutput.log 2>/dev/null || true
            cat build/CMakeFiles/CMakeError.log 2>/dev/null || true
            exit 1
          }

          cmake --build build
          macdeployqt build/Telegram.app || true
          codesign --force --deep -s - build/Telegram.app || true

      - name: Upload cmake logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-error-logs
          path: |
            ${{ env.REPO_NAME }}/build/CMakeFiles/CMakeOutput.log
            ${{ env.REPO_NAME }}/build/CMakeFiles/CMakeError.log
          retention-days: 7

      - name: Move and package artifact.
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          mkdir -p artifact
          cp $REPO_NAME/新手使用指南.txt artifact/ 2>/dev/null || true
          ditto -c -k --sequesterRsrc --keepParent $REPO_NAME/build/Telegram.app artifact/Telegram_macOS.zip
          cp -R $REPO_NAME/build/Telegram.app artifact/

      - uses: actions/upload-artifact@v4
        if: env.UPLOAD_ARTIFACT == 'true'
        name: Upload artifact.
        with:
          name: Telegram_macOS
          path: artifact/
          retention-days: 7

      - name: Publish to GitHub Release.
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/feature/speed-boost' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: latest-boost
          name: Telegram Desktop Boost (Latest)
          body: |
            ## 🚀 Telegram Desktop Boost 极速增强版
            * **构建分支**: `${{ github.ref_name }}`
            * **提交哈希**: `${{ github.sha }}`

            ### 🌟 核心功能特性与开关位置

            #### 1. ⚡ Network Boost（16 通道并发与极限下载加速）
            * **文件下载（另存为）**：开启 1MB 超大分片 + 16 通道并发，拉满物理带宽；
            * **视频在线播放**：128KB 规范切片 + 8MB 激进预读缓冲 + 32 切片并发流水线，4K 原画秒播不卡顿；
            * **长连接保活**：120 秒 Keep-Alive 热连接，免去频繁重新握手延迟。
            * **开关位置**：`设置 (Settings) -> 高级 (Advanced) -> 数据与存储 (Data and storage) -> Network Boost`（默认开启）。

            #### 2. 🎬 自动连续播放与沉浸全屏
            * 视频播放完毕后自动无缝衔接下一个媒体，切换后 1 秒自动平滑淡出隐藏进度条；
            * 支持快捷键 `F` 一键全屏（图片与视频均支持）；
            * 手动 `Ctrl + 右键` 切换时，图片保持全屏展示，切换回视频后进度条自动隐藏。
            * **开关位置**：内置播放器控制条右侧的 **YouTube 风格滑动开关**（可随时开启/关闭）。

            #### 3. ↗️ 原位转发（播放不中断）
            * 无论全屏或窗口模式下观看视频，右键点击“转发”时，底层视频持续流畅播放；
            * 转发面板在视频上方浮层弹出，选择目标发送后自动关闭，观影与分享两不耽误。

            #### 4. 🔄 软件内一键原生自动更新
            * 自动检测专属 GitHub Release 最新版本；
            * 有新版本发布时，聊天列表顶部自动弹出绿色 **`Update Telegram`** 提示，点击即可毫秒级热替换重启完成升级；
            * Windows 用户亦可随时在安装目录下双击运行 **`一键更新.bat`** 快速同步最新版本。

            ### 📥 快速安装与数据迁移
            * **Windows 用户**：下载下方 `Telegram_x64_qt6.zip` 解压至任意非系统盘文件夹（如 `D:\Software\Telegram\`）直接运行。
            * **老用户无缝迁移（免重新登录）**：将旧版 Telegram 目录下的 **`tdata`** 文件夹直接复制到本软件目录下，双击即可免密登录，聊天记录与配置 100% 完整保留。
            * **一键汉化语言包**：登录后在聊天框打开 `https://t.me/setlanguage/zhcncc` 即可切换中文。
            * **macOS 用户**：下载 `Telegram_macOS.zip` 解压将 `Telegram.app` 拖入“应用程序”。如遇门禁拦截，右键选择“打开”，或在终端执行 `xattr -cr /Applications/Telegram.app` 即可。
          files: |
            artifact/Telegram_macOS.zip
            artifact/新手使用指南.txt
