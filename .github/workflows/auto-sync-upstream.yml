name: Auto Sync Upstream Releases

on:
  schedule:
    # 每天北京时间中午 12:00 (UTC 04:00) 自动检查一次上游官方更新
    - cron: '0 4 * * *'
  workflow_dispatch: # 支持在 GitHub Actions 页面手动一键触发

jobs:
  sync:
    name: Check & Sync Upstream
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feature/speed-boost
          fetch-depth: 1

      - name: Check latest official release
        id: check_upstream
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/telegramdesktop/tdesktop/releases/latest | jq -r .tag_name)
          echo "Latest official tag: $LATEST_TAG"
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

          # 从本地源码文件中读取当前构建版本
          CURRENT_VERSION="v$(grep -m1 '^AppVersionStrSmall' Telegram/build/version | awk '{print $2}')"
          echo "Current repository version: $CURRENT_VERSION"
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          if [ "$LATEST_TAG" = "$CURRENT_VERSION" ]; then
            echo "Already up to date with official release $LATEST_TAG"
            echo "need_sync=false" >> $GITHUB_OUTPUT
          else
            echo "New upstream version found: $LATEST_TAG (Current: $CURRENT_VERSION)"
            echo "need_sync=true" >> $GITHUB_OUTPUT
          fi

      - name: Notify new upstream release
        if: steps.check_upstream.outputs.need_sync == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const latest = '${{ steps.check_upstream.outputs.latest_tag }}';
            const current = '${{ steps.check_upstream.outputs.current_version }}';
            const issueTitle = `【官方上游更新提示】检测到 Telegram 官方发布了新版本 ${latest}`;
            
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });
            const existing = issues.data.find(i => i.title.includes(latest));
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: `### 🚀 Telegram 官方发布了新版本！\n\n- **官方最新版本**: [${latest}](https://github.com/telegramdesktop/tdesktop/releases/tag/${latest})\n- **当前专属加速版版本**: ${current}\n\n如需升级适配最新版本，可在本地或云端合并 ${latest} 标签代码并推送编译。`
              });
              console.log(`Created notification issue for ${latest}`);
            } else {
              console.log(`Issue for ${latest} already exists.`);
            }
